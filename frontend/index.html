<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Test Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 10px;
        }

        button:hover {
            background: #764ba2;
        }

        .response {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
            display: none;
        }

        .response.show {
            display: block;
        }

        .response h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .response p {
            color: #666;
            word-break: break-all;
        }

        .status-success {
            border-left: 4px solid #4caf50;
        }

        .status-error {
            border-left: 4px solid #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Frontend Test Application</h1>
        
        <div class="form-group">
            <label for="nameInput">Enter Name:</label>
            <input type="text" id="nameInput" placeholder="Type your name here...">
        </div>

        <button onclick="sendRequest()">Send to Backend</button>
        <button onclick="testHello()">Test Hello Endpoint</button>

        <div id="response" class="response">
            <h3>Response:</h3>
            <p id="responseText"></p>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        function sendRequest() {
            const nameInput = document.getElementById('nameInput').value;
            
            if (!nameInput.trim()) {
                showResponse('Please enter a name', true);
                return;
            }

            fetch(`${API_URL}/data`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name: nameInput })
            })
            .then(response => response.json())
            .then(data => {
                showResponse(JSON.stringify(data, null, 2), false);
                document.getElementById('nameInput').value = '';
            })
            .catch(error => {
                showResponse(`Error: ${error.message}`, true);
            });
        }

        function testHello() {
            fetch(`${API_URL}/hello`)
                .then(response => response.json())
                .then(data => {
                    showResponse(JSON.stringify(data, null, 2), false);
                })
                .catch(error => {
                    showResponse(`Error: ${error.message}`, true);
                });
        }

        function showResponse(message, isError) {
            const responseDiv = document.getElementById('response');
            const responseText = document.getElementById('responseText');
            
            responseDiv.classList.add('show');
            responseDiv.classList.toggle('status-error', isError);
            responseDiv.classList.toggle('status-success', !isError);
            responseText.textContent = message;
        }

        // Allow Enter key to submit
        document.getElementById('nameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendRequest();
            }
        });
    </script>
</body>
</html>
